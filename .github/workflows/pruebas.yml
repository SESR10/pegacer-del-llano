# Fase 16: pruebas automáticas en cada PR y en cada cambio de main.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pegacer
          POSTGRES_PASSWORD: pegacer
          POSTGRES_DB: pegacer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pegacer -d pegacer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Pruebas de integración
        run: mvn -B -q test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/pegacer_test
          DB_USER: pegacer
          DB_PASSWORD: pegacer

  frontend:
    name: Frontend (compilación y pruebas en el navegador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Compilar (tipos y producción)
        run: npm run build
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Pruebas de punta a punta (escritorio y celular)
        run: npm run test:e2e
      - name: Guardar informe si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: frontend/playwright-report
          retention-days: 7
