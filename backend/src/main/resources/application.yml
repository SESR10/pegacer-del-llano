server:
  port: ${PORT:8080}
  # En Railway/Render el sistema corre detrás de un proxy HTTPS: respetar X-Forwarded-*
  # para que Spring no tome como "otro sitio" las peticiones de su propia pantalla (CORS 403).
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application.name: pegacer-sistema
  profiles.active: ${SPRING_PROFILES_ACTIVE:demo}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pegacer}
    username: ${DB_USER:pegacer}
    password: ${DB_PASSWORD:pegacer}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

app:
  cors.origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-de-desarrollo-minimo-32-caracteres}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  # Límite de intentos de inicio de sesión (ver security/LoginAttempts.java).
  login:
    max-por-usuario: ${LOGIN_MAX_POR_USUARIO:5}
    max-por-ip: ${LOGIN_MAX_POR_IP:20}
    bloqueo-minutos: ${LOGIN_BLOQUEO_MINUTOS:15}
  # Versión vigente de la Política de Tratamiento de Datos (frontend/src/legal). Si se cambia la política,
  # cambie también esta fecha: todos los usuarios deberán aceptarla de nuevo al entrar.
  privacidad.version: ${PRIVACIDAD_VERSION:2026-11-25}
  # Solo perfil prod, y solo si la base no tiene usuarios: crea el primer Administrador.
  admin:
    usuario: ${ADMIN_USUARIO:}
    contrasena: ${ADMIN_CONTRASENA:}
    nombre: ${ADMIN_NOMBRE:Administrador}

springdoc:
  swagger-ui.path: /swagger-ui.html
---
spring:
  config.activate.on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
---
# Producción: solo el esquema (sin datos DEMO) y sin Swagger público.
# Ver docs/PRODUCCION.md. Necesita una base nueva: Flyway se niega a arrancar sobre una base que ya tiene la migración DEMO.
spring:
  config.activate.on-profile: prod
springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false
