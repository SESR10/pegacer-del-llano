server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application.name: pegacer-sistema
  profiles.active: ${SPRING_PROFILES_ACTIVE:demo}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pegacer}
    username: ${DB_USER:pegacer}
    password: ${DB_PASSWORD:pegacer}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

app:
  cors.origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-de-desarrollo-minimo-32-caracteres}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}

springdoc:
  swagger-ui.path: /swagger-ui.html
---
spring:
  config.activate.on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
